[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-equivalence"
dynamic = ["version"]

description = "A comprehensive library for analyzing SQL query equivalence"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yifan Yang", email = "yifan.yang@transwarp.io" }
]
keywords = ["sql", "equivalence", "query-analysis", "relational-algebra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "sqlglot>=11.0.0",
    "networkx>=2.8",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5", "graphviz>=0.19", "plotly>=5.0"]
ml = ["torch>=2.0", "transformers>=4.30"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.0"]

[project.urls]
Homepage = "https://github.com/yfyang86/SQLEquiv"
Issues = "https://github.com/yfyang86/SQLEquiv/issues"
Source = "https://github.com/yfyang86/SQLEquiv"

[project.entry-points."sql_equivalence.methods"]
# Built-in methods are registered programmatically; this table is reserved for
# third-party packages.

[tool.setuptools_scm]
write_to = "sql_equivalence/_version.py"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
# Full --strict is deferred to Phase C; enabling incrementally now.
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# Keep the default ruleset lean -- we'll tighten with each phase.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by `line-length`
    "E741",   # ambiguous variable names are common in algebra code
    "F821",   # forward-reference strings used to avoid circular imports
    "F401",   # __init__ re-exports; tracked as Phase C cleanup
    "B904",   # `raise ... from` -- applied incrementally
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["B018"]
# Phase-C cleanup candidates: legacy modules with unused vars / loop controls
# and one `is` vs `==` comparison. Tracked in Future-Plan.md.
"**/transformations/*" = ["F841", "B007", "E721"]
"**/equivalence/algebraic_equivalence.py" = ["E721"]
"**/operators/base_operator.py" = ["F841"]
"**/parser/sql_parser.py" = ["F841"]
"**/representations/algebraic/relational_algebra.py" = ["F841"]
"**/utils/sql_utils.py" = ["F841"]
"**/representations/graph/*" = ["B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v"