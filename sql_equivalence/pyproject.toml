[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-equivalence"
dynamic = ["version"]

description = "A comprehensive library for analyzing SQL query equivalence"
readme = "README.md" 
requires-python = ">=3.8"
authors = [
    { name = "Yifan Yang", email = "yifan.yang@transwarp.io" }
]

[tool.setuptools_scm]
write_to = "sql_equivalence/_version.py"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
# Full --strict is deferred to Phase C; enabling incrementally now.
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# Keep the default ruleset lean -- we'll tighten with each phase.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by `line-length`
    "E741",   # ambiguous variable names are common in algebra code
    "F821",   # forward-reference strings used to avoid circular imports
    "F401",   # __init__ re-exports; tracked as Phase C cleanup
    "B904",   # `raise ... from` -- applied incrementally
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["B018"]
# Phase-C cleanup candidates: legacy modules with unused vars / loop controls
# and one `is` vs `==` comparison. Tracked in Future-Plan.md.
"**/transformations/*" = ["F841", "B007", "E721"]
"**/equivalence/algebraic_equivalence.py" = ["E721"]
"**/operators/base_operator.py" = ["F841"]
"**/parser/sql_parser.py" = ["F841"]
"**/representations/algebraic/relational_algebra.py" = ["F841"]
"**/utils/sql_utils.py" = ["F841"]
"**/representations/graph/*" = ["B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v"